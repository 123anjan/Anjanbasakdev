<div class="container">
  <h1>FormSubmit Demo</h1>
  <form target="_blank" action="https://formsubmit.co/anjantchi@gmail.com" method="POST">
    <h3 class="title">Contact Us</h3>

              <div class="input-container">
                <input type="text" name="name" class="input" required />
                <label class="bg-label">Username</label>
                <span>Username</span>
              </div>

              <div class="input-container">
                <input type="email" name="email" class="input" required />
                <label class="bg-label">Email</label>
                <span>Email</span>
              </div>

              <div class="input-container phone-container">
                <div class="phone-input-group">
                  <select
                    name="countryCode"
                    class="country-code-select"
                    aria-label="Country Code"
                  >
                    <option value="+91" selected>+91 (IN)</option>
                    <option value="+1">+1 (US/CA)</option>
                    <option value="+44">+44 (UK)</option>
                    <option value="+61">+61 (AU)</option>
                    <option value="+81">+81 (JP)</option>
                  </select>
                  <div class="phone-input-wrapper">
                    <input
                      type="tel"
                      name="phone"
                      id="phoneInput"
                      class="input"
                      placeholder="Phone Number (10 digits)"
                      maxlength="10"
                      required
                    />
                    <label></label>
                  </div>
                </div>
                <span id="phoneError" class="error-text" style="display: none"
                  >Please enter a valid 10-digit phone number.</span
                >
              </div>

              <div class="input-container textarea">
                <textarea
                  name="message"
                  class="input"
                  required
                  class="input"
                ></textarea>
                <label class="bg-label">Message</label>
                <span>Message</span>
              </div>

              <input type="submit" value="Send" class="btn-submit" />

              <!-- Success Message Notification (Hidden by default) -->
              <div
                id="successMessage"
                class="success-message"
                style="display: none"
              >
                🎉 Thank you! Your message has been sent successfully.
              </div>
  </form>
</div>
